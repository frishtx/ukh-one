<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UKH One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600&display=swap">
<style>
body{margin:0}

:root{
  color-scheme:light;
  --white:#FFFFFF; --panel:#F6F8FB; --panel-2:#EEF2F7; --line:#E2E7EE; --line-2:#CFD7E2;
  --navy:#002D72; --navy-deep:#00173D; --blue:#1B6BBC; --blue-soft:#E8F1FA; --blue-line:#B9D2EC;
  --head:#00173D; --text:#3E4652; --muted:#6B7482;
  --crit:#B42318; --crit-soft:#FDECEA; --warn:#8A5A00; --warn-soft:#FFF4DB; --ok:#1F7A45; --ok-soft:#E5F4EB;
  --sans:'Source Sans 3','Source Sans Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --ku:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--white);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{color:var(--head)}

/* Top strip + header, as on ukh.edu.krd */
.strip{background:var(--navy);color:#fff;font-size:13.5px}
.strip .in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:7px 16px}
.strip .proto{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.strip .proto::before{content:"";width:7px;height:7px;border-radius:50%;background:#FFC857}
.strip nav{display:flex;gap:4px;flex-wrap:wrap}
.strip nav button{background:none;border:0;color:#fff;padding:2px 9px;border-radius:6px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.strip nav button::before{content:"";width:6px;height:6px;border-radius:50%;background:#6EE7A0}
.strip nav button:hover{background:rgba(255,255,255,.12)}
header.hd{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hd .in{display:flex;align-items:center;gap:18px;padding:12px 16px}
.logo{display:flex;align-items:center;gap:14px;flex:none}
.logo img{height:46px;width:auto;display:block}
.logo .prod{border-left:1px solid var(--line-2);padding-left:14px;line-height:1.15}
.logo .prod b{display:block;color:var(--head);font-size:19px;font-weight:800;letter-spacing:-.01em}
.logo .prod span{font-size:12.5px;color:var(--muted)}
.search{position:relative;flex:1;max-width:560px;margin-left:auto}
.search input{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:10px 14px 10px 38px;font:inherit;font-size:15px;color:var(--text);background:var(--panel)}
.search input:focus{background:#fff}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,23,61,.14);padding:6px;max-height:420px;overflow:auto;z-index:30}
.results .grp{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;font-size:15px}
.results button:hover{background:var(--blue-soft)}
.results button span{color:var(--muted);font-size:13px}
.hd-actions{display:flex;align-items:center;gap:10px;flex:none;position:relative}
.iconbtn{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.iconbtn svg{width:19px;height:19px;stroke:var(--head);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-5px;right:-5px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px;border:2px solid #fff}
.me{display:flex;align-items:center;gap:10px}
.me .av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13.5px}
.me b{display:block;color:var(--head);font-size:15px;line-height:1.2}
.me span{font-size:12.5px;color:var(--muted)}
.notif{position:absolute;right:0;top:calc(100% + 8px);width:min(400px,calc(100vw - 32px));background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,23,61,.14);padding:8px;z-index:30}
.notif h3{font-size:14px;margin:6px 8px 8px}
.notif button{display:grid;grid-template-columns:8px 1fr;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 8px;font-size:14.5px}
.notif button:hover{background:var(--panel)}
.notif i{width:8px;height:8px;border-radius:50%;margin-top:7px}
.notif small{display:block;color:var(--muted);font-size:12.5px}
.menu{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100% - 110px)}
aside.side{border-right:1px solid var(--line);padding:16px 12px 24px;position:sticky;top:71px;align-self:start;max-height:calc(100vh - 71px);overflow:auto}
.side .glabel{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.side .glabel:first-child{padding-top:2px}
.side button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 12px;color:var(--text);font-weight:500;font-size:15.5px}
.side button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.side button:hover{background:var(--panel);color:var(--head)}
.side button[aria-current="page"]{background:var(--blue-soft);color:var(--navy);font-weight:700;box-shadow:inset 3px 0 0 var(--blue)}
.side button .cnt{margin-left:auto;font-size:12px;font-weight:700;background:var(--crit-soft);color:var(--crit);border-radius:999px;padding:0 7px}
main{min-width:0;padding-inline:clamp(16px,2.6vw,36px);padding-block:26px 60px}

/* Page */
.view{display:flex;flex-direction:column;gap:20px;animation:rise .3s ease both;max-width:1360px}
@keyframes rise{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}
.crumb{font-size:13px;color:var(--muted);margin:0 0 4px;font-weight:600;letter-spacing:.02em}
.crumb b{color:var(--blue)}
.vh h1{font-weight:800;font-size:clamp(28px,3.1vw,38px);line-height:1.1;letter-spacing:-.015em;margin:0;text-wrap:balance}
.vh .lead{margin:8px 0 0;color:var(--muted);max-width:74ch;font-size:17px}
.ba{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ba div{padding:12px 16px;font-size:15px}
.ba div b{display:block;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:2px}
.ba .b4{background:var(--panel);color:var(--muted)}
.ba .b4 b{color:var(--muted)}
.ba .af{background:var(--blue-soft);color:var(--navy);border-left:1px solid var(--blue-line)}
.ba .af b{color:var(--blue)}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.card>h2{font-size:17px;font-weight:700;margin:0 0 2px}
.card>.sub{font-size:14px;color:var(--muted);margin:0 0 14px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cardhead h2{font-size:17px;font-weight:700;margin:0 0 2px}
.cardhead .sub{font-size:14px;color:var(--muted);margin:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g21{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi .chip{white-space:normal}
.kpi{border:1px solid var(--line);border-radius:12px;padding:15px 17px;display:flex;flex-direction:column;gap:4px;background:#fff}
.kpi .lbl{font-size:14px;color:var(--muted);font-weight:600}
.kpi .num{font-size:32px;font-weight:800;color:var(--head);line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.chip{align-self:flex-start;display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.info{background:var(--blue-soft);color:var(--blue)}
.chip.web{background:var(--blue-soft);color:var(--navy)}

.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
td.wrap{white-space:normal;min-width:200px}
td.n,th.n{text-align:right}
td small{display:block;color:var(--muted);font-size:13px}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--line-2);color:var(--head)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel)}
td b{color:var(--head)}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--blue);border-radius:8px;padding:8px 15px;font-weight:700;font-size:14.5px;background:var(--blue);color:#fff;white-space:nowrap}
.btn:hover{background:#155aa0}
.btn.sec{background:#fff;color:var(--blue)}
.btn.sec:hover{background:var(--blue-soft)}
.btn.sm{padding:4px 10px;font-size:13.5px}
.btn.done{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok);cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:700;font-size:14.5px}
.link:hover{text-decoration:underline}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar .top{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;margin-bottom:5px}
.bar .top b{color:var(--head);font-weight:600}
.bar .top span{color:var(--muted);font-variant-numeric:tabular-nums}
.track{position:relative;height:10px;border-radius:99px;background:var(--panel-2);overflow:visible}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--blue)}
.track .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--head)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}

.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--sans);font-size:11.5px;fill:var(--muted)}

/* alerts / lists */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px 10px 0;border-radius:10px;background:var(--panel)}
.alert .sbar{align-self:stretch;border-radius:0 4px 4px 0}
.alert.crit .sbar{background:var(--crit)} .alert.warn .sbar{background:#D69E2E} .alert.info .sbar{background:var(--blue)} .alert.ok .sbar{background:var(--ok)}
.alert p{margin:0;font-size:15px}
.alert p small{display:block;color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}

.systems{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.sys{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.sys b{color:var(--head);font-size:15px}
.sys span{font-size:12.5px;color:var(--ok);font-weight:600;display:flex;align-items:center;gap:6px}
.sys span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:8px}
.fstep{display:grid;grid-template-columns:130px minmax(0,1fr) 70px;gap:12px;align-items:center;font-size:14.5px}
.fstep .fb{height:30px;border-radius:6px;background:var(--blue);display:flex;align-items:center;padding-left:10px;color:#fff;font-weight:700;font-variant-numeric:tabular-nums;min-width:48px}
.fstep em{font-style:normal;color:var(--muted);font-size:13px;text-align:right}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--panel);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:200px}
.col h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;margin:4px 6px;color:var(--muted);display:flex;justify-content:space-between}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px}
.kc b{display:block;color:var(--head)}
.kc span{font-size:13px;color:var(--muted);display:block}
.kc .amt{font-weight:700;color:var(--head);font-variant-numeric:tabular-nums}

/* heatmap */
.heat{display:grid;gap:3px;font-size:12.5px;overflow-x:auto}
.heat .hc{height:26px;border-radius:4px;display:grid;place-items:center;font-weight:600;font-size:11.5px}
.heat .rl{color:var(--text);white-space:nowrap;padding-right:8px;align-self:center}
.heat .cl{color:var(--muted);text-align:center}

/* milestones */
.ms{display:flex;gap:4px}
.ms i{width:26px;height:8px;border-radius:99px;background:var(--panel-2)}
.ms i.d{background:var(--ok)} .ms i.n{background:var(--blue)} .ms i.o{background:var(--crit)}

/* profile */
.prof{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.prof .big{width:64px;height:64px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.prof h2{font-size:26px;margin:0;font-weight:800}
.prof p{margin:2px 0 0;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--panel);border-radius:10px;padding:10px 12px}
.fact span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.fact b{font-size:18px;color:var(--head)}
.srcrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* early warning */
.slist{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}
.srow:hover{border-color:var(--blue)}
.srow[aria-selected="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--blue-soft)}
.ini{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--panel-2);color:var(--head)}
.srow b{display:block;font-size:15.5px;color:var(--head)}
.srow span{font-size:13px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.score{display:flex;align-items:center;gap:14px;padding:14px;border-radius:10px;background:var(--panel);margin:14px 0 16px}
.score .bign{font-size:40px;font-weight:800;line-height:1}
.score .sc{flex:1}
.score small{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.why{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:9px}
.why li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:15.5px}
.why li::before{content:"!";width:22px;height:22px;border-radius:50%;background:var(--crit-soft);color:var(--crit);font-weight:800;font-size:12px;display:grid;place-items:center}
.suggest{border-left:3px solid var(--blue);padding:10px 14px;background:var(--blue-soft);border-radius:0 10px 10px 0;margin-bottom:14px;color:var(--navy)}
.suggest b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}

/* chat */
.chat{display:flex;flex-direction:column;gap:14px;min-height:500px}
.msgs{display:flex;flex-direction:column;gap:12px;flex:1}
.msg{max-width:min(660px,88%);padding:12px 15px;border-radius:14px;font-size:16px;line-height:1.55}
.msg.bot{background:var(--panel);border-top-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-top-right-radius:4px}
.msg ul{margin:6px 0 0;padding-left:18px}
.msg .src{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:700}
.msg .src::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.src.web{color:var(--blue)} .src.sample{color:var(--warn)}
.msg[dir="rtl"]{font-family:var(--ku);font-size:17px;line-height:1.8}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.sugs{display:flex;flex-wrap:wrap;gap:8px}
.sugs button{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 13px;font-size:14.5px;color:var(--head);text-align:left}
.sugs button:hover{border-color:var(--blue);color:var(--blue)}
.sugs button.ku{font-family:var(--ku)}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:8px;padding:10px 14px;font:inherit}
.vis{position:absolute;left:-9999px}

/* paperwork */
.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px}
.doc:hover{border-color:var(--blue)}
.doc[aria-selected="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--blue-soft)}
.doc b{display:block;font-size:15.5px;color:var(--head)}
.doc span{font-size:13px;color:var(--muted)}
.paper{background:#fff;border:1px solid var(--line-2);border-radius:4px;padding:22px 24px;font-size:15.5px;line-height:1.6;box-shadow:0 2px 10px rgba(0,23,61,.06);margin-bottom:16px}
.paper .ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.paper .ph b{color:var(--navy);letter-spacing:.04em}
.paper p{margin:0 0 8px}
.steps{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;align-items:center;gap:10px;font-size:15.5px;color:var(--muted)}
.steps .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center}
.steps li.run{color:var(--head)} .steps li.run .dot{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.ok{color:var(--head)} .steps li.ok .dot{background:var(--ok);border-color:var(--ok)}
.steps li.ok .dot::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
@keyframes spin{to{transform:rotate(360deg)}}
.fields{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:7px 16px;font-size:15px;margin:0 0 16px}
.fields dt{color:var(--muted)} .fields dd{margin:0;font-weight:600;color:var(--head)}
.result{display:flex;gap:10px;padding:13px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:15.5px;margin-bottom:12px}
.progress{height:10px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin:6px 0 8px}
.progress div{height:100%;width:0;background:var(--blue);transition:width .45s ease}

/* report */
.report{border:1px solid var(--line-2);border-radius:4px;padding:clamp(20px,4vw,44px);box-shadow:0 2px 10px rgba(0,23,61,.06)}
.report header{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:3px solid var(--navy);padding-bottom:16px;margin-bottom:8px}
.report header img{height:44px;width:auto}
.report h3{font-size:24px;margin:0;font-weight:800}
.report .rmeta{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.report h4{font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:22px 0 6px}
.report p{margin:0 0 8px;font-size:16px;line-height:1.6;max-width:74ch}
.w{background:var(--blue-soft);color:var(--navy);padding:0 3px;border-radius:3px}
.s{background:#FFF1C9;color:#6B4A07;padding:0 3px;border-radius:3px}
.gen{white-space:pre-wrap;background:var(--panel);border-radius:10px;padding:14px 16px;font-size:15.5px;min-height:120px}
select{font:inherit;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:#fff;color:var(--head)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy-deep);color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){ .g3{grid-template-columns:repeat(2,minmax(0,1fr))} .g21,.g12{grid-template-columns:minmax(0,1fr)} .me div{display:none} }
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside.side{position:fixed;inset:0 auto 0 0;top:0;width:280px;max-height:none;height:100%;background:#fff;z-index:40;box-shadow:0 0 40px rgba(0,23,61,.25);padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .menu{display:grid}
  .logo .prod{display:none}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .ba{grid-template-columns:minmax(0,1fr)} .ba .af{border-left:0;border-top:1px solid var(--blue-line)}
}
@media (max-width:560px){
  .hd .in{flex-wrap:wrap} .search{order:3;flex-basis:100%;max-width:none}
  .logo img{height:38px}
  .fstep{grid-template-columns:96px minmax(0,1fr) 54px}
  .kpi .num{font-size:28px}
}

function lineChart(series,labels,min,max,ticks,fy,opt={}){
  const W=640,H=230,l=46,r=16,t=14,b=28;
  const x=i=>l+(W-l-r)*i/(labels.length-1), y=v=>t+(H-t-b)*(max-v)/(max-min);
  let g=ticks.map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end">${fy(v)}</text>`).join('');
  g+=labels.map((s,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${s}</text>`).join('');
  if(opt.target!=null) g+=`<line x1="${l}" x2="${W-r}" y1="${y(opt.target)}" y2="${y(opt.target)}" stroke="var(--ok)" stroke-dasharray="5 5" stroke-width="1.5"/><text x="${W-r}" y="${y(opt.target)-6}" text-anchor="end" style="fill:var(--ok);font-weight:700">${opt.targetLabel}</text>`;
  series.forEach((s,si)=>{
    const pts=s.v.map((v,i)=>`${x(i)},${y(v)}`);
    if(si===0&&!opt.noArea) g+=`<path d="M${x(0)},${y(min)} L${pts.join(' L')} L${x(s.v.length-1)},${y(min)} Z" fill="${s.c}" fill-opacity=".1"/>`;
    g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="6 5"':''}/>`;
    const li=s.v.length-1; g+=`<circle cx="${x(li)}" cy="${y(s.v[li])}" r="4.5" fill="${s.c}" stroke="#fff" stroke-width="2"/>`;
    if(s.end) g+=`<text x="${x(li)-8}" y="${y(s.v[li])+(s.endBelow?18:-10)}" text-anchor="end" style="fill:var(--head);font-weight:700;font-size:12.5px">${s.end}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||'')}">${g}</svg></div>${series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}</div>`:''}`;
}
function alertRow(a){return `<div class="alert ${a.lvl}"><span class="sbar"></span><p><small>${a.tag}</small>${a.text}</p>${a.go?`<button class="btn sec sm" data-go="${a.go}"${a.arg?` data-arg="${a.arg}"`:''}>${a.btn||'Open'}</button>`:''}</div>`;}

  ${kpis([['Items','44,000+','Since 2006','web'],['Opening hours','Sun–Thu, 8am–8pm','Houses the American Corner','web'],['Loans this month','1,236','Up 9%','ok'],['Overdue items','58','Reminders ready','warn'],['E-resource sessions','9,410','This month']])}
  <div class="g2">
    ${card('Loans per month','2026',lineChart([{n:'Loans',v:[980,1105,1190,1240,1310,640,310,520,1236],c:'#1B6BBC',end:'1,236'}],['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'],0,1500,[0,500,1000,1500],v=>fmt(v),{label:'Monthly library loans'}))}
    ${card('Most borrowed this month','',table([{t:'Title'},{t:'Loans',n:1}],[['Gray’s Anatomy for Students',42],['Introduction to Algorithms',31],['Principles of Economics',27],['Guyton and Hall Textbook of Medical Physiology',25],['Legal Method',19]].map(b=>`<tr><td class="wrap">${b[0]}</td><td class="n">${b[1]}</td></tr>`)),`<button class="btn sec" data-toast="58 overdue reminders sent to students and staff">Send overdue reminders</button>`)}
  </div>`;};

/* ===== Media, events & PR ===== */
const evs=[['Open Day, Fall 2027 admissions','20 Nov','Admissions'],['Career Fair','5 Nov','Career Development Centre'],['Public lecture series','15 Oct','Centre for Peacebuilding and Dialogue'],['Kurdish language AI workshop','22 Oct','AI and Innovation Centre']];
const drafts={0:`UKH Open Day: meet us on 20 November\n\nThinking about university in 2027? Come and see the University of Kurdistan Hewlêr, the first public English-medium university in Iraq and the Kurdistan Region.\n\nTour our four schools, talk to lecturers and students, and learn about our 67 programmes, from Medicine and Engineering to Law and Business.\n\nApplications for Fall 2027 are open on the Admission Portal.`,1:`Career Fair on 5 November\n\nThe Career Development Centre invites all students and recent graduates to meet employers from across Kurdistan and Iraq. Bring your CV, ask about internships, and find out why 99% of UKH alumni are in work.`,2:`Public lecture series begins 15 October\n\nThe Centre for Peacebuilding and Dialogue opens its autumn lecture series. All staff, students and members of the public are welcome.`,3:`Workshop: Kurdish language AI, 22 October\n\nThe Artificial Intelligence and Innovation Centre runs a hands-on workshop on building AI tools for Kurdish: translation, language detection and named-entity recognition. Open to students and staff.`};
let evSel=0, evText='';
V.events=function(){
  return `${head('Quality & reputation','Media, events & PR','Events, announcements, the website and social media, planned and measured in one place.','Events, press, the website and social media are handled by different people in different places.','One calendar, one set of numbers, and announcements drafted in seconds.')}
  ${kpis([['Website visitors this month','48,200','Up 12%','ok'],['Applicants who found us online','61%','Of Fall 2027 applicants','info'],['Media mentions this month','23','Positive: 21','ok'],['Upcoming events','4','Next: 15 Oct']])}
  <div class="g2">
    ${card('Upcoming events','Sample dates',table([{t:'Event'},{t:'Date'},{t:'Organiser'}],evs.map(e=>`<tr><td><b>${e[0]}</b></td><td>${e[1]}</td><td>${e[2]}</td></tr>`)))}
    ${card('Draft an announcement','UKH One writes it from what it knows about UKH',`<div class="btns" style="margin-bottom:12px"><label for="evsel" class="vis">Event</label><select id="evsel">${evs.map((e,i)=>`<option value="${i}"${i===evSel?' selected':''}>${e[0]}</option>`).join('')}</select><button class="btn" id="draft">Write announcement</button></div><div class="gen" id="gen">${esc(evText)||'<span style="color:var(--muted)">Pick an event and press Write announcement.</span>'}</div>`)}
  </div>
  ${card('Where Fall 2027 applicants heard about UKH','',bars([['UKH website',61],['Social media',19],['Friends and family',11],['School visits and fairs',6],['Other',3]].map(x=>({l:x[0],t:x[1]+'%',v:x[1]})),70))}`;};
A.events=()=>{$('#evsel').addEventListener('change',e=>{evSel=+e.target.value;});$('#draft').addEventListener('click',async()=>{const t=drafts[evSel];const g=$('#gen');g.textContent='';for(let i=0;i<=t.length;i+=6){g.textContent=t.slice(0,i);await wait(12);}evText=t;g.textContent=t;});};

/* ===== Careers & alumni ===== */
V.careers=function(){
  return `${head('Quality & reputation','Careers & alumni','Internships, employers and graduate outcomes, connected to student records and the alumni app.','Graduate outcomes are collected once a year by survey.','Placements and alumni careers are tracked all year through the alumni app and employer partners.')}
  ${kpis([['Alumni employed','99%','As reported by UKH','web'],['Internship placements this year','186','Up 14%','ok'],['Employer partners','74','9 new this year','info'],['Alumni app users','2,340','Connected']])}
  <div class="g2">
    ${card('Where graduates work','Share of employed alumni by sector',bars([['Healthcare',24],['Oil, gas and energy',18],['Government and public sector',16],['Banking and finance',14],['Technology',12],['Education',9],['NGOs and international organisations',7]].map(x=>({l:x[0],t:x[1]+'%',v:x[1]})),30))}
    ${card('Coming up','Career Development Centre',`<div class="alerts">${[{lvl:'info',tag:'5 Nov',text:'Career Fair with employers from Kurdistan and Iraq'},{lvl:'ok',tag:'This week',text:'38 final-year students matched to internships by their skills and grades'},{lvl:'warn',tag:'Action',text:'22 final-year students have no CV on file yet'}].map(alertRow).join('')}</div><div class="btns" style="margin-top:12px"><button class="btn sec" data-toast="22 students invited to a CV workshop at the Career Development Centre">Invite to CV workshop</button></div>`)}
  </div>`;};

/* ---------- router & global UI ---------- */
let cur='overview', curArg=null;
function render(){ view.innerHTML=`<section class="view">${V[cur](curArg)}</section>`; A[cur]?.(); }
function go(id,arg=null){ if(!V[id]||id==='prototype')id='overview'; cur=id; curArg=arg; renderSide(id); render(); window.scrollTo({top:0}); closePop(); if(innerWidth<=900) $('#side').hidden=true; try{history.replaceState(null,'','#'+id);}catch(e){} }

/* search */
const index=[
  ...MODS.map(m=>({g:'Modules',t:m.l,s:m.g,go:m.id})),
  ...studentsDB.map(s=>({g:'Students',t:s.name,s:s.prog+', Year '+s.yr,go:'registry',arg:String(s.id)})),
  ...staffDB.map(s=>({g:'Staff',t:s[0],s:s[1],go:'hr',q:s[0]})),
  ...courses.map(c=>({g:'Moodle courses',t:c.c+' '+c.n,s:c.lec,go:'moodle'})),
  ...docsData.map(d=>({g:'Documents',t:d.title,s:d.from,go:'approvals',doc:d.id})),
];
const q=$('#q'), res=$('#results');
q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase(); if(!v){res.hidden=true;return;}
  const hits=index.filter(x=>(x.t+' '+x.s).toLowerCase().includes(v)).slice(0,12);
  if(!hits.length){res.innerHTML=`<div class="grp">No results</div>`;res.hidden=false;return;}
  let h='',g=''; hits.forEach((x,i)=>{if(x.g!==g){g=x.g;h+=`<div class="grp">${g}</div>`;} h+=`<button data-hit="${index.indexOf(x)}">${esc(x.t)}<span>${esc(x.s)}</span></button>`;});
  res.innerHTML=h; res.hidden=false;});
function closePop(){res.hidden=true;$('#notif').hidden=true;}
$('#notif').innerHTML=`<h3>Notifications</h3>${alerts.map(a=>`<button data-go="${a.go}"><i style="background:${a.lvl==='crit'?'#B42318':a.lvl==='warn'?'#D69E2E':'#1B6BBC'}"></i><span>${a.text}<small>${a.tag}</small></span></button>`).join('')}`;
$('#bell').addEventListener('click',e=>{e.stopPropagation();const n=$('#notif');n.hidden=!n.hidden;res.hidden=true;});
$('#menuBtn').addEventListener('click',e=>{e.stopPropagation();const s=$('#side');s.hidden=!s.hidden;});

document.addEventListener('click',e=>{
  if(!e.target.closest('.search')&&!e.target.closest('#notif')&&!e.target.closest('#bell')) closePop();
  if(innerWidth<=900&&!e.target.closest('#side')&&!e.target.closest('#menuBtn')) $('#side').hidden=true;
  const el=e.target.closest('button,tr.click'); if(!el) return; const d=el.dataset;
  if(d.hit!=null){const x=index[+d.hit]; q.value=''; if(x.q)staffQ=x.q; if(x.doc)docSel=x.doc; return go(x.go,x.arg||null);}
  if(d.go){ if(d.go==='registry'&&!d.arg) regSel=null; return go(d.go,d.arg||null); }
  if(d.toast) return toast(d.toast);
  if(d.ask) return ask(d.ask);
  if(d.regf){regSchool=d.regf;regSel=null;curArg=null;return render();}
  if(d.ewf){ewF=d.ewf;curArg=null;return render();}
  if(d.ew){ewSel=+d.ew;curArg=null;return render();}
  if(d.notify){const s=studentsDB.find(x=>x.id===+d.notify);notified.add(s.id);render();return toast(`${s.to} has been sent ${s.name.split(' ')[0]}’s summary and the suggested next step`);}
  if(d.doc){docSel=d.doc;return render();}
  if(d.process) return processDoc(d.process);
  if(d.approve){docState[d.approve].stage=6;render();return toast('Approved. Procurement will order from Supplier C today.');}
  if(d.leave!=null){leaveDone.add(+d.leave);render();return toast('Leave approved. The staff member and their manager have been told.');}
  if(d.assign!=null){assigned.add(+d.assign);render();return toast('Assigned to the facilities team. The person who reported it gets updates.');}
});
if(innerWidth<=900) $('#side').hidden=true;
let wasWide=innerWidth>900; addEventListener('resize',()=>{const w=innerWidth>900; if(w!==wasWide){$('#side').hidden=!w; wasWide=w;}});
go((location.hash||'').slice(1)||'overview');
})();
</script>
